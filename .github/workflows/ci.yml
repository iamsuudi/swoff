name: CI

on:
  push:
    branches: [main, docs]
  pull_request:
    branches: [main, docs]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install
      - run: bunx turbo run build
      - run: bunx vitest run
        working-directory: apps/cli
      - run: bunx turbo run check-types
